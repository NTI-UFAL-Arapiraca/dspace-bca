worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker DNS keeps upstreams reachable after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_forwarded_proto $dspace_public_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /dspace {
            return 301 /dspace/;
        }

        # DSpace Angular serves robots.txt at its root, outside ui.nameSpace.
        location = /dspace/robots.txt {
            set $angular http://dspace-angular:4000;
            rewrite ^ /robots.txt break;
            proxy_pass $angular;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $dspace_public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Preserve /dspace: Angular is configured to serve this namespace.
        location /dspace/ {
            set $angular http://dspace-angular:4000;
            proxy_pass $angular;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $dspace_public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /dspace-api {
            return 301 /dspace-api/;
        }

        # The backend's internal servlet context remains /server.
        location /dspace-api/ {
            set $rest http://dspace:8080;
            rewrite ^/dspace-api/(.*)$ /server/$1 break;
            proxy_pass $rest;
            proxy_cookie_path /server /dspace-api;
            client_max_body_size 2g;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $dspace_public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
