<div class="container">
  <div class="collection-page"
    *ngVar="(collectionRD$ | async) as collectionRD">
    @if (collectionRD?.hasSucceeded) {
      <div @fadeInOut>
        @if (collectionRD?.payload; as collection) {
          <div>
            <div class="collection-header">
              <header class="comcol-header collection-header__copy">
                <p class="ufal-eyebrow">{{ 'repository.collection.eyebrow' | translate }}</p>
                <ds-comcol-page-header [name]="dsoNameService.getName(collection)"></ds-comcol-page-header>
                @if (logoRD$) {
                  <ds-comcol-page-logo
                    [logo]="(logoRD$ | async)?.payload"
                    [alternateText]="'collection.logo' | translate">
                  </ds-comcol-page-logo>
                }
                <ds-comcol-page-content
                  [content]="collection.introductoryText"
                  [hasInnerHtml]="true">
                </ds-comcol-page-content>
                <ds-comcol-page-content
                  [content]="collection.sidebarText"
                  [hasInnerHtml]="true"
                  [title]="'collection.page.news'">
                </ds-comcol-page-content>
                <ds-comcol-page-handle
                  [content]="collection.handle"
                  [title]="'collection.page.handle'">
                </ds-comcol-page-handle>
              </header>
              <aside class="collection-header__aside">
                <ds-dso-edit-menu></ds-dso-edit-menu>
                <ds-collection-overview [scope]="collection.id"></ds-collection-overview>
              </aside>
            </div>
            <section class="comcol-page-browse-section">
              <ds-comcol-page-browse-by
                [id]="collection.id"
                [contentType]="collection.type">
              </ds-comcol-page-browse-by>
              <router-outlet></router-outlet>
            </section>
            @if (collection.copyrightText) {
              <footer class="border-top my-5 pt-4">
                <ds-comcol-page-content
                  [content]="collection.copyrightText"
                  [hasInnerHtml]="true">
                </ds-comcol-page-content>
              </footer>
            }
          </div>
        }
      </div>
    }
    @if (collectionRD?.hasFailed) {
      <ds-error message="{{'error.collection' | translate}}"></ds-error>
    }
    @if (collectionRD?.isLoading) {
      <ds-loading message="{{'loading.collection' | translate}}"></ds-loading>
    }
  </div>
</div>
