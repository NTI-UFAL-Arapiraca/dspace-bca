<section class="repository-intro" aria-labelledby="repository-intro-title">
  <div class="container repository-intro__layout">
    <div class="repository-intro__copy">
      <p class="ufal-eyebrow">{{ 'repository.home.eyebrow' | translate }}</p>
      <h1 id="repository-intro-title">{{ 'repository.home.title' | translate }}</h1>
      <p class="repository-intro__description">{{ 'repository.home.description' | translate }}</p>
      <div class="repository-intro__search">
        <ds-search-form [inPlaceSearch]="false" [showScopeSelector]="false"
          [searchPlaceholder]="'repository.home.search.placeholder' | translate"></ds-search-form>
        <ds-home-suggestions></ds-home-suggestions>
      </div>
    </div>
    <ds-home-stats class="repository-intro__stats"></ds-home-stats>
  </div>
</section>
