@if (homeHeaderMetadataValue$ | async; as homeHeaderMetadataValue) {
  <div class="container home-header">
    <ds-markdown-viewer [value]="homeHeaderMetadataValue"></ds-markdown-viewer>
  </div>
}
<ds-home-coar></ds-home-coar>
<ds-home-news></ds-home-news>
@if (showDiscoverFilters) {
  <ds-configuration-search-page [sideBarWidth]="3" [showViewModes]="false"
    [searchEnabled]="false" [inPlaceSearch]="false" [showScopeSelector]="false">
    <ng-container searchContentTop *ngTemplateOutlet="homeContent"></ng-container>
  </ds-configuration-search-page>
} @else {
  <div class="container"><ng-container *ngTemplateOutlet="homeContent"></ng-container></div>
}
<ds-suggestions-popup></ds-suggestions-popup>

<ng-template #homeContent>
  <section class="home-search" aria-labelledby="home-search-title">
    <div class="home-search__heading">
      <h2 id="home-search-title">{{ 'repository.home.search.title' | translate }}</h2>
      <p>{{ 'repository.home.search.help' | translate }}</p>
    </div>
    <ds-search-form [inPlaceSearch]="false" [showScopeSelector]="false"
      [searchPlaceholder]="'repository.home.search.placeholder' | translate"></ds-search-form>
  </section>
  <div class="home-discovery" [class.home-discovery--communities-only]="recentSubmissionspageSize <= 0">
    @if (recentSubmissionspageSize > 0) {
      <ds-home-recent-records></ds-home-recent-records>
    }
    <ds-top-level-community-list></ds-top-level-community-list>
  </div>
</ng-template>
